# Netlify config for the Nuji SPA + separate admin page
[build]
  command = "npm install --ignore-scripts=false && npx --yes vite build"
  publish = "dist"

# The admin portal is its own page
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# Every other route goes to the public SPA (React handles the path)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
